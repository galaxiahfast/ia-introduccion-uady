# Cueva propuesta para el ejercicio 1.
# Las coordenadas son 1-based y (1, 1) es la esquina inferior izquierda.

grid:
  width: 4
  height: 4

agent:
  start: [1, 1]
  direction: east
  arrows: 1

wumpus: [4, 3]

pits:
  - [2, 2]
  - [4, 1]
  - [3, 4]

gold: [1, 4]

scoring:
  gold: 1000
  death: -1000
  step: -1
  shoot: -10

max_steps: 200
